[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medallion-platform"
version = "1.0.0"
description = "Plataforma extensible de integración, procesamiento, gobernanza y analítica de datos Medallion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "minio>=7.2.0",
    "boto3>=1.34.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "duckdb>=0.10.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]

[tool.ruff]
line-length = 120
target-version = "py311"
