    // State
    let currentSlideIndex = 0;
    const totalSlides = slidesData.length;

    // DOM Elements
    const slideContainer = document.getElementById("slideContainer");
    const progressBar = document.getElementById("progressBar");
    const slideCounter = document.getElementById("slideCounter");
    const slideCategory = document.getElementById("slideCategory");
    const slideSelect = document.getElementById("slideSelect");
    const speakerNotesText = document.getElementById("speakerNotesText");
    const notesDrawer = document.getElementById("notesDrawer");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const toggleNotesBtn = document.getElementById("toggleNotesBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const slideStage = document.getElementById("slideStage");

    // Populate Slide Selector
    slidesData.forEach((slide, idx) => {
      const option = document.createElement("option");
      option.value = idx;
      option.textContent = `${slide.id}. ${slide.title}`;
      slideSelect.appendChild(option);
    });

    // Render Slide
    function renderSlide(index) {
      if (index < 0 || index >= totalSlides) return;
      currentSlideIndex = index;
      const slide = slidesData[index];

      // Smooth transition
      slideContainer.classList.remove("slide-active");
      
      setTimeout(() => {
        slideContainer.innerHTML = slide.html;
        slideCategory.textContent = slide.category;
        slideCounter.textContent = `${index + 1} / ${totalSlides}`;
        slideSelect.value = index;
        speakerNotesText.textContent = slide.notes;

        // Progress bar calculation
        const progressPercent = ((index + 1) / totalSlides) * 100;
        progressBar.style.width = `${progressPercent}%`;

        // Button states
        prevBtn.disabled = index === 0;
        prevBtn.classList.toggle("opacity-40", index === 0);
        prevBtn.classList.toggle("cursor-not-allowed", index === 0);

        slideContainer.classList.add("slide-active");
      }, 100);
    }

    // Event Listeners
    prevBtn.addEventListener("click", () => {
      if (currentSlideIndex > 0) renderSlide(currentSlideIndex - 1);
    });

    nextBtn.addEventListener("click", () => {
      if (currentSlideIndex < totalSlides - 1) {
        renderSlide(currentSlideIndex + 1);
      } else {
        renderSlide(0);
      }
    });

    slideSelect.addEventListener("change", (e) => {
      renderSlide(parseInt(e.target.value));
    });

    toggleNotesBtn.addEventListener("click", () => {
      notesDrawer.classList.toggle("hidden");
    });

    fullscreenBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        if (slideStage.requestFullscreen) {
          slideStage.requestFullscreen();
        } else if (slideStage.webkitRequestFullscreen) {
          slideStage.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    // Keyboard Navigation
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        e.preventDefault();
        if (currentSlideIndex < totalSlides - 1) renderSlide(currentSlideIndex + 1);
      } else if (e.key === "ArrowLeft" || e.key === "PageUp" || e.key === "Backspace") {
        e.preventDefault();
        if (currentSlideIndex > 0) renderSlide(currentSlideIndex - 1);
      } else if (e.key === "Home") {
        renderSlide(0);
      } else if (e.key === "End") {
        renderSlide(totalSlides - 1);
      } else if (e.key.toLowerCase() === "n") {
        notesDrawer.classList.toggle("hidden");
      } else if (e.key.toLowerCase() === "f") {
        fullscreenBtn.click();
      }
    });

    // Initial render
    renderSlide(0);
  </script>
