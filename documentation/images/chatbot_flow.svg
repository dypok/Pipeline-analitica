<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" style="background:#0b1120; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="c-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <text x="30" y="28" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">ARQUITECTURA DE CONSULTA EN LENGUAJE NATURAL A SQL (NL-TO-SQL)</text>

  <!-- Step 1: User Question -->
  <g transform="translate(30, 50)" filter="url(#c-shadow)">
    <rect width="160" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="160" height="34" rx="10" fill="#0f172a"/>
    <text x="14" y="22" fill="#38bdf8" font-size="11" font-weight="700">1. PREGUNTA USUARIO</text>
    
    <g transform="translate(12, 48)">
      <rect width="136" height="50" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="8" y="20" fill="#f8fafc" font-size="9.5" font-style="italic">"¿Cuáles fueron las"</text>
      <text x="8" y="36" fill="#f8fafc" font-size="9.5" font-style="italic">"ventas de ayer?"</text>
      <text x="0" y="80" fill="#94a3b8" font-size="9.5">Lenguaje Natural</text>
      <text x="0" y="94" fill="#64748b" font-size="9">Español / Negocio</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(195, 120)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="25,0 18,-4 18,4" fill="#38bdf8"/>
  </g>

  <!-- Step 2: Prompt Router & Catalog -->
  <g transform="translate(225, 50)" filter="url(#c-shadow)">
    <rect width="170" height="150" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <rect width="170" height="34" rx="10" fill="#0f172a"/>
    <text x="14" y="22" fill="#818cf8" font-size="11" font-weight="700">2. ROUTER &amp; PROMPT</text>
    
    <g transform="translate(12, 48)">
      <text x="0" y="14" fill="#e0e7ff" font-size="10" font-weight="600">Esquema Gold Inyectado</text>
      <text x="0" y="32" fill="#94a3b8" font-size="9">• DDL de daily_sales</text>
      <text x="0" y="48" fill="#94a3b8" font-size="9">• Reglas de negocio</text>
      <text x="0" y="64" fill="#94a3b8" font-size="9">• Restricción SELECT</text>
      <text x="0" y="84" fill="#818cf8" font-size="9.5" font-weight="600">Prompt Blindado</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(400, 120)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#818cf8" stroke-width="2.5"/>
    <polygon points="25,0 18,-4 18,4" fill="#818cf8"/>
  </g>

  <!-- Step 3: Sovereign LLM -->
  <g transform="translate(430, 50)" filter="url(#c-shadow)">
    <rect width="180" height="150" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect width="180" height="34" rx="10" fill="#581c87"/>
    <text x="14" y="22" fill="#f3e8ff" font-size="11" font-weight="800">3. LLM LOCAL SOBERANO</text>
    
    <g transform="translate(12, 48)">
      <rect width="156" height="36" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
      <text x="78" y="22" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">Qwen 2.5 (2B Local)</text>
      
      <text x="0" y="58" fill="#34d399" font-size="9.5" font-weight="600">✓ $0 Costos de Inferencia</text>
      <text x="0" y="74" fill="#34d399" font-size="9.5" font-weight="600">✓ Datos nunca salen de red</text>
      <text x="0" y="90" fill="#c084fc" font-size="9">Generación precisa de SQL</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(615, 120)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#a855f7" stroke-width="2.5"/>
    <polygon points="25,0 18,-4 18,4" fill="#a855f7"/>
  </g>

  <!-- Step 4: SQL Guard & Validator -->
  <g transform="translate(645, 50)" filter="url(#c-shadow)">
    <rect width="145" height="150" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="145" height="34" rx="10" fill="#0f172a"/>
    <text x="12" y="22" fill="#f59e0b" font-size="11" font-weight="700">4. SQLGUARD</text>
    
    <g transform="translate(10, 48)">
      <text x="0" y="14" fill="#fef3c7" font-size="10" font-weight="600">Validación AST</text>
      <text x="0" y="32" fill="#94a3b8" font-size="9">• Solo SELECT</text>
      <text x="0" y="48" fill="#f87171" font-size="9">• Bloquea DROP/INSERT</text>
      <text x="0" y="64" fill="#f87171" font-size="9">• Bloquea mutaciones</text>
      <text x="0" y="84" fill="#34d399" font-size="9.5" font-weight="600">100% Seguro</text>
    </g>
  </g>

  <!-- Arrow 4 -> 5 -->
  <g transform="translate(795, 120)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#f59e0b" stroke-width="2.5"/>
    <polygon points="25,0 18,-4 18,4" fill="#f59e0b"/>
  </g>

  <!-- Step 5: DuckDB Execution -->
  <g transform="translate(825, 50)" filter="url(#c-shadow)">
    <rect width="105" height="150" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="105" height="34" rx="10" fill="#064e3b"/>
    <text x="10" y="22" fill="#6ee7b7" font-size="11" font-weight="800">5. DUCKDB</text>
    
    <g transform="translate(10, 48)">
      <text x="0" y="14" fill="#34d399" font-size="9.5" font-weight="700">Ejecuta SQL</text>
      <text x="0" y="32" fill="#cbd5e1" font-size="9">Sobre Parquet</text>
      <text x="0" y="52" fill="#f8fafc" font-size="12" font-weight="800">&lt; 50 ms</text>
      <text x="0" y="75" fill="#a7f3d0" font-size="9">Devuelve DF</text>
    </g>
  </g>

  <!-- Return Flow: DuckDB back to Final Response -->
  <g transform="translate(875, 205)">
    <path d="M 0 0 L 0 50 L -400 50" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3" fill="none"/>
    <polygon points="-400,50 -393,46 -393,54" fill="#10b981"/>
  </g>

  <!-- Final Response Block -->
  <g transform="translate(30, 240)" filter="url(#c-shadow)">
    <rect width="440" height="130" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="440" height="30" rx="10" fill="#064e3b" fill-opacity="0.4"/>
    <text x="16" y="20" fill="#6ee7b7" font-size="11" font-weight="700">6. RESPUESTA SINTETIZADA AL USUARIO</text>
    
    <g transform="translate(16, 42)">
      <rect width="408" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" fill="#e2e8f0" font-size="10.5">Ayer las ventas totales alcanzaron $42,850 USD con 312 pedidos,</text>
      <text x="12" y="33" fill="#e2e8f0" font-size="10.5">un incremento del 8.4% respecto al promedio semanal.</text>
      
      <text x="0" y="66" fill="#94a3b8" font-size="9.5">Sin alucinaciones: Cada cifra proviene directamente del resultado ejecutado en DuckDB.</text>
    </g>
  </g>

  <!-- ErrorCode Catalog Block -->
  <g transform="translate(500, 240)" filter="url(#c-shadow)">
    <rect width="430" height="130" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <rect width="430" height="30" rx="10" fill="#1e293b"/>
    <text x="16" y="20" fill="#cbd5e1" font-size="11" font-weight="700">CATÁLOGO DE CÓDIGOS DE ERROR (CERO FALLBACKS FALSOS)</text>
    
    <g transform="translate(16, 42)">
      <text x="0" y="14" fill="#38bdf8" font-family="monospace" font-size="10">ERR_NO_DATA_FOUND</text>
      <text x="160" y="14" fill="#94a3b8" font-size="9.5">Filtro temporal o categoría vacía</text>
      
      <text x="0" y="34" fill="#f87171" font-family="monospace" font-size="10">ERR_SQL_SECURITY</text>
      <text x="160" y="34" fill="#94a3b8" font-size="9.5">Sentencia mutadora bloqueada</text>
      
      <text x="0" y="54" fill="#f59e0b" font-family="monospace" font-size="10">ERR_OUT_OF_SCOPE</text>
      <text x="160" y="54" fill="#94a3b8" font-size="9.5">Pregunta fuera del dominio analítico</text>
      
      <text x="0" y="74" fill="#a855f7" font-family="monospace" font-size="10">ERR_LLM_UNAVAILABLE</text>
      <text x="160" y="74" fill="#94a3b8" font-size="9.5">Inferencia local temporalmente ocupada</text>
    </g>
  </g>
</svg>