<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" style="background:#0b1120; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#334155" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1000" height="480" fill="url(#grid)" />

  <!-- SECTION 1: INGESTION -->
  <g transform="translate(30, 30)" filter="url(#shadow)">
    <rect width="200" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="200" height="44" rx="12" fill="#0f172a" />
    <path d="M 0 32 L 200 32" stroke="#334155" stroke-width="1"/>
    
    <circle cx="26" cy="22" r="12" fill="#38bdf8" fill-opacity="0.15"/>
    <path d="M 22 22 L 30 22 M 26 18 L 30 22 L 26 26" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="27" fill="#f8fafc" font-size="12" font-weight="700" letter-spacing="0.5">INGESTA MULTI-FUENTE</text>

    <!-- Source Items -->
    <g transform="translate(15, 60)">
      <rect width="170" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="14" y="24" fill="#38bdf8" font-size="12" font-weight="600">APIs REST Externas</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10">Paginación &amp; Auth Bearer</text>
    </g>

    <g transform="translate(15, 135)">
      <rect width="170" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="14" y="24" fill="#38bdf8" font-size="12" font-weight="600">Archivos CSV / Parquet</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10">Cargas periódicas en batch</text>
    </g>

    <g transform="translate(15, 210)">
      <rect width="170" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="14" y="24" fill="#38bdf8" font-size="12" font-weight="600">Eventos JSON Semi-estruc.</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10">Validación de esquemas</text>
    </g>

    <g transform="translate(15, 285)">
      <rect width="170" height="40" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1"/>
      <text x="85" y="25" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Contrato Común Ingesta</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(235, 190)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,3"/>
    <polygon points="35,0 27,-5 27,5" fill="#38bdf8"/>
  </g>

  <!-- SECTION 2: LAKEHOUSE MEDALLION -->
  <g transform="translate(275, 30)" filter="url(#shadow)">
    <rect width="230" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="230" height="44" rx="12" fill="#0f172a" />
    <path d="M 0 32 L 230 32" stroke="#334155" stroke-width="1"/>
    
    <circle cx="26" cy="22" r="12" fill="#a855f7" fill-opacity="0.15"/>
    <path d="M 21 26 L 31 26 M 21 22 L 31 22 M 21 18 L 31 18" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
    <text x="46" y="27" fill="#f8fafc" font-size="12" font-weight="700" letter-spacing="0.5">LAKEHOUSE (MinIO S3)</text>

    <!-- Layers -->
    <g transform="translate(15, 55)">
      <rect width="200" height="42" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
      <circle cx="15" cy="21" r="5" fill="#94a3b8"/>
      <text x="28" y="21" fill="#cbd5e1" font-size="11" font-weight="700">LANDING</text>
      <text x="88" y="21" fill="#64748b" font-size="10">Raw Crudo Inmutable</text>
      <text x="28" y="34" fill="#475569" font-size="9" font-family="monospace">minio://landing/</text>
    </g>

    <g transform="translate(15, 105)">
      <rect width="200" height="42" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
      <circle cx="15" cy="21" r="5" fill="#d97706"/>
      <text x="28" y="21" fill="#f59e0b" font-size="11" font-weight="700">BRONZE</text>
      <text x="88" y="21" fill="#94a3b8" font-size="10">Parquet Estructurado</text>
      <text x="28" y="34" fill="#475569" font-size="9" font-family="monospace">minio://bronze/</text>
    </g>

    <g transform="translate(15, 155)">
      <rect width="200" height="42" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="15" cy="21" r="5" fill="#e2e8f0"/>
      <text x="28" y="21" fill="#f1f5f9" font-size="11" font-weight="700">SILVER</text>
      <text x="88" y="21" fill="#94a3b8" font-size="10">Limpio &amp; Enriquecido</text>
      <text x="28" y="34" fill="#475569" font-size="9" font-family="monospace">minio://silver/</text>
    </g>

    <g transform="translate(15, 205)">
      <rect width="200" height="46" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="15" cy="23" r="5" fill="#38bdf8"/>
      <text x="28" y="22" fill="#38bdf8" font-size="11" font-weight="700">GOLD</text>
      <text x="70" y="22" fill="#93c5fd" font-size="10">Data Marts Negocio</text>
      <text x="28" y="37" fill="#60a5fa" font-size="9" font-family="monospace">daily_sales • customer_360</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="200" height="42" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
      <circle cx="15" cy="21" r="5" fill="#ef4444"/>
      <text x="28" y="21" fill="#fca5a5" font-size="11" font-weight="700">CUARENTENA</text>
      <text x="110" y="21" fill="#f87171" font-size="9">Aislamiento Errores</text>
      <text x="28" y="34" fill="#f87171" font-size="8" opacity="0.8">Valores nulos/inválidos</text>
    </g>

    <text x="115" y="325" fill="#a855f7" font-size="10" font-weight="600" text-anchor="middle">Transformado con Apache Spark</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(510, 190)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4,3"/>
    <polygon points="35,0 27,-5 27,5" fill="#a855f7"/>
  </g>

  <!-- SECTION 3: DUCKDB QUERY ENGINE -->
  <g transform="translate(550, 30)" filter="url(#shadow)">
    <rect width="170" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="170" height="44" rx="12" fill="#0f172a" />
    <path d="M 0 32 L 170 32" stroke="#334155" stroke-width="1"/>
    
    <circle cx="26" cy="22" r="12" fill="#34d399" fill-opacity="0.15"/>
    <path d="M 27 16 L 21 23 L 26 23 L 25 28 L 31 21 L 26 21 Z" fill="#34d399"/>
    <text x="46" y="27" fill="#f8fafc" font-size="12" font-weight="700" letter-spacing="0.5">MOTOR DUCKDB</text>

    <g transform="translate(12, 60)">
      <rect width="146" height="70" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="10" y="24" fill="#34d399" font-size="11" font-weight="700">Lectura Vectorizada</text>
      <text x="10" y="42" fill="#94a3b8" font-size="9.5">Directo sobre Parquet</text>
      <text x="10" y="58" fill="#94a3b8" font-size="9.5">Sin duplicar datos</text>
    </g>

    <g transform="translate(12, 145)">
      <rect width="146" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="24" fill="#34d399" font-size="11" font-weight="700">Latencia Mínima</text>
      <text x="10" y="42" fill="#f8fafc" font-size="13" font-weight="800">&lt; 150 ms</text>
      <text x="10" y="58" fill="#64748b" font-size="9.5">Velocidad sub-segundo</text>
    </g>

    <g transform="translate(12, 230)">
      <rect width="146" height="85" rx="8" fill="#064e3b" fill-opacity="0.25" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="24" fill="#6ee7b7" font-size="10" font-weight="700">Cero Infra Costosa</text>
      <text x="10" y="42" fill="#cbd5e1" font-size="9">Base de datos embebida</text>
      <text x="10" y="58" fill="#cbd5e1" font-size="9">en memoria y proceso</text>
      <text x="10" y="74" fill="#34d399" font-size="9" font-weight="600">Sin servidores DW</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(725, 190)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4,3"/>
    <polygon points="35,0 27,-5 27,5" fill="#34d399"/>
  </g>

  <!-- SECTION 4: CONSUMPTION LAYER -->
  <g transform="translate(765, 30)" filter="url(#shadow)">
    <rect width="205" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="205" height="44" rx="12" fill="#0f172a" />
    <path d="M 0 32 L 205 32" stroke="#334155" stroke-width="1"/>
    
    <circle cx="26" cy="22" r="12" fill="#38bdf8" fill-opacity="0.15"/>
    <rect x="21" y="17" width="10" height="8" rx="1" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <path d="M 23 27 L 29 27" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="46" y="27" fill="#f8fafc" font-size="12" font-weight="700" letter-spacing="0.5">CAPA DE CONSUMO</text>

    <!-- Channel 1: Streamlit -->
    <g transform="translate(12, 60)">
      <rect width="181" height="120" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="20" cy="22" r="7" fill="#0284c7" fill-opacity="0.2"/>
      <path d="M 17 22 L 23 22 M 20 19 L 20 25" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="34" y="26" fill="#38bdf8" font-size="12" font-weight="700">Dashboards Streamlit</text>
      
      <text x="14" y="50" fill="#cbd5e1" font-size="10">• KPIs ejecutivos en vivo</text>
      <text x="14" y="68" fill="#cbd5e1" font-size="10">• Gráficos Plotly interactivos</text>
      <text x="14" y="86" fill="#cbd5e1" font-size="10">• Filtros por fecha y canal</text>
      <text x="14" y="104" fill="#94a3b8" font-size="9.5">Vistas Ventas, Clientes, Prod.</text>
    </g>

    <!-- Channel 2: Chatbot -->
    <g transform="translate(12, 195)">
      <rect width="181" height="130" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
      <circle cx="20" cy="22" r="7" fill="#7c3aed" fill-opacity="0.2"/>
      <circle cx="20" cy="22" r="3" fill="#a855f7"/>
      <text x="34" y="26" fill="#c084fc" font-size="12" font-weight="700">Chatbot IA Soberano</text>
      
      <text x="14" y="50" fill="#cbd5e1" font-size="10">• NL-to-SQL con Qwen 2.5 (2B)</text>
      <text x="14" y="68" fill="#cbd5e1" font-size="10">• Validador de seguridad SQL</text>
      <text x="14" y="86" fill="#cbd5e1" font-size="10">• Cero costo de tokens / API</text>
      <text x="14" y="104" fill="#a855f7" font-size="10" font-weight="600">Misma Fuente de Verdad</text>
      <text x="14" y="118" fill="#64748b" font-size="8.5">Sin discrepancia con el Dashboard</text>
    </g>
  </g>

  <!-- BOTTOM BAR: GOVERNANCE & OPERATIONS -->
  <g transform="translate(30, 390)" filter="url(#shadow)">
    <rect width="940" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="35" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">GOBERNANZA &amp; OPS TRANSVERSAL</text>
    
    <g transform="translate(250, 15)">
      <rect width="200" height="30" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="100" y="20" fill="#93c5fd" font-size="11" font-weight="600" text-anchor="middle">Airflow: Orquestación &amp; SLAs</text>
    </g>

    <g transform="translate(470, 15)">
      <rect width="210" height="30" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
      <text x="105" y="20" fill="#c4b5fd" font-size="11" font-weight="600" text-anchor="middle">OpenMetadata: Linaje de Datos</text>
    </g>

    <g transform="translate(700, 15)">
      <rect width="210" height="30" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
      <text x="105" y="20" fill="#fbcfe8" font-size="11" font-weight="600" text-anchor="middle">Apache Atlas: Catálogo &amp; PII</text>
    </g>
  </g>
</svg>