<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" style="background:#0b1120; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="m-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <text x="30" y="30" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">FLUJO DE PROCESAMIENTO SECUENCIAL Y ELEVACIÓN DE CALIDAD</text>

  <!-- Step 1: Landing -->
  <g transform="translate(30, 50)" filter="url(#m-shadow)">
    <rect width="200" height="230" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect width="200" height="40" rx="10" fill="#334155"/>
    <text x="20" y="26" fill="#f1f5f9" font-size="14" font-weight="800">1. LANDING</text>
    <text x="180" y="26" fill="#94a3b8" font-size="10" text-anchor="end">Crudo</text>
    
    <g transform="translate(15, 60)">
      <text x="0" y="15" fill="#38bdf8" font-size="11" font-weight="600">Almacenamiento:</text>
      <text x="0" y="32" fill="#cbd5e1" font-size="11">MinIO (S3 Raw)</text>
      
      <text x="0" y="62" fill="#38bdf8" font-size="11" font-weight="600">Características:</text>
      <text x="0" y="80" fill="#94a3b8" font-size="10">• Payload inmutable 100%</text>
      <text x="0" y="98" fill="#94a3b8" font-size="10">• Timestamps y source_id</text>
      <text x="0" y="116" fill="#94a3b8" font-size="10">• Preservación histórica</text>
      <text x="0" y="134" fill="#94a3b8" font-size="10">• Formatos CSV, JSON, API</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(235, 150)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#64748b" stroke-width="3"/>
    <polygon points="25,0 18,-4 18,4" fill="#64748b"/>
  </g>

  <!-- Step 2: Bronze -->
  <g transform="translate(265, 50)" filter="url(#m-shadow)">
    <rect width="200" height="230" rx="10" fill="#1e293b" stroke="#d97706" stroke-width="1.5"/>
    <rect width="200" height="40" rx="10" fill="#78350f"/>
    <text x="20" y="26" fill="#fef3c7" font-size="14" font-weight="800">2. BRONZE</text>
    <text x="180" y="26" fill="#fde68a" font-size="10" text-anchor="end">Tipado</text>
    
    <g transform="translate(15, 60)">
      <text x="0" y="15" fill="#f59e0b" font-size="11" font-weight="600">Almacenamiento:</text>
      <text x="0" y="32" fill="#cbd5e1" font-size="11">MinIO / Parquet</text>
      
      <text x="0" y="62" fill="#f59e0b" font-size="11" font-weight="600">Características:</text>
      <text x="0" y="80" fill="#94a3b8" font-size="10">• Esquema columnar Parquet</text>
      <text x="0" y="98" fill="#94a3b8" font-size="10">• Conversión estricta tipos</text>
      <text x="0" y="116" fill="#94a3b8" font-size="10">• Cero pérdida de filas</text>
      <text x="0" y="134" fill="#94a3b8" font-size="10">• Particionado temporal</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(470, 150)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#f59e0b" stroke-width="3"/>
    <polygon points="25,0 18,-4 18,4" fill="#f59e0b"/>
  </g>

  <!-- Step 3: Silver -->
  <g transform="translate(500, 50)" filter="url(#m-shadow)">
    <rect width="200" height="230" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <rect width="200" height="40" rx="10" fill="#334155"/>
    <text x="20" y="26" fill="#f8fafc" font-size="14" font-weight="800">3. SILVER</text>
    <text x="180" y="26" fill="#cbd5e1" font-size="10" text-anchor="end">Limpio</text>
    
    <g transform="translate(15, 60)">
      <text x="0" y="15" fill="#e2e8f0" font-size="11" font-weight="600">Almacenamiento:</text>
      <text x="0" y="32" fill="#cbd5e1" font-size="11">Spark Parquet Refinado</text>
      
      <text x="0" y="62" fill="#e2e8f0" font-size="11" font-weight="600">Características:</text>
      <text x="0" y="80" fill="#94a3b8" font-size="10">• Deduplicación por clave</text>
      <text x="0" y="98" fill="#94a3b8" font-size="10">• Normalización de texto</text>
      <text x="0" y="116" fill="#94a3b8" font-size="10">• Enriquecimiento cruzado</text>
      <text x="0" y="134" fill="#94a3b8" font-size="10">• Filtro de calidad estricto</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 (Gold) -->
  <g transform="translate(705, 120)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="25,0 18,-4 18,4" fill="#38bdf8"/>
  </g>

  <!-- Step 4: Gold -->
  <g transform="translate(735, 50)" filter="url(#m-shadow)">
    <rect width="195" height="145" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="195" height="38" rx="10" fill="#0369a1"/>
    <text x="15" y="25" fill="#f0f9ff" font-size="13" font-weight="800">4. GOLD (CONSUMO)</text>
    
    <g transform="translate(12, 50)">
      <text x="0" y="14" fill="#38bdf8" font-size="11" font-weight="700">Modelos Analíticos:</text>
      <text x="0" y="32" fill="#e2e8f0" font-size="10.5">• daily_sales (Ventas)</text>
      <text x="0" y="50" fill="#e2e8f0" font-size="10.5">• customer_360 (Clientes RFM)</text>
      <text x="0" y="68" fill="#e2e8f0" font-size="10.5">• product_performance (Stock)</text>
      <text x="0" y="86" fill="#34d399" font-size="9.5" font-weight="600">→ Consulta directa con DuckDB</text>
    </g>
  </g>

  <!-- Branch Silver -> Quarantine -->
  <g transform="translate(600, 280)">
    <path d="M 0 0 L 0 35 L 135 35" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3" fill="none"/>
    <polygon points="135,35 128,31 128,39" fill="#ef4444"/>
    <text x="20" y="25" fill="#f87171" font-size="9" font-weight="600">Registros corruptos / nulos</text>
  </g>

  <!-- Quarantine Box -->
  <g transform="translate(735, 215)" filter="url(#m-shadow)">
    <rect width="195" height="110" rx="10" fill="#2d0606" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="195" height="30" rx="10" fill="#7f1d1d"/>
    <text x="15" y="20" fill="#fee2e2" font-size="12" font-weight="800">ZONA DE CUARENTENA</text>
    <g transform="translate(12, 42)">
      <text x="0" y="12" fill="#fca5a5" font-size="9.5" font-weight="600">Aislamiento sin abortar lote:</text>
      <text x="0" y="28" fill="#fecaca" font-size="9">• Error catalogado (error_reason)</text>
      <text x="0" y="44" fill="#fecaca" font-size="9">• Timestamp &amp; archivo origen</text>
      <text x="0" y="60" fill="#ef4444" font-size="9" font-weight="700">Trazabilidad para reingesta</text>
    </g>
  </g>

  <!-- Bottom Legend / Note -->
  <g transform="translate(30, 340)">
    <rect width="900" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#10b981"/>
    <text x="32" y="20" fill="#94a3b8" font-size="10.5">Idempotencia y Reprocesabilidad: Cada etapa puede ejecutarse múltiples veces garantizando idéntico resultado sin duplicar registros.</text>
  </g>
</svg>